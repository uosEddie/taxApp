<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tax Management App">
    <meta name="keywords" content="Tax Management App">

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>

<body>

    <div id="message-box" class="message-box"></div>

    <div class="mobile-nav" id="mobile-nav">

        <div class="mobile-nav-top">

            <button type="button" onclick="menuOpen()" class="menu-btn" id="menu-btn">
                <span class="material-symbols-outlined">menu</span>
            </button>

            <a href="profile.html" class="mobile-user-profile">
                <img class="profile-pic" src="Images/stock-profile.jpeg">
            </a>

            <button id="mobile-logout-btn" class="mobile-logout-btn">
                LogOut
            </button>

        </div>

        <div class="mobile-nav-links" id="mobile-nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="records.html">Records</a>
            <a href="tax-summary.html">Tax Summary</a>
            <a href="user-management.html">User Management</a>
            <a href="audit-log.html">Audit Log</a>
        </div>

    </div>

    <div class="admin-nav" id="admin-nav">

        <h2 class="logo" id="logo">TaxApp</h2>

        <a href="profile.html" class="user-profile">
            <img class="profile-pic" src="Images/stock-profile.jpeg">
        </a>

        <button id="logout-btn" class="logout-btn">
            LogOut
        </button>

    </div>

    <div class="app" id="app">

        <aside class="sidebar" id="sidebar">

            <nav>
                <a href="dashboard.html"><button>Dashboard</button></a>
                <a href="records.html"><button>Records</button></a>
                <a href="tax-summary.html"><button>Tax Summary</button></a>
                <a href="user-management.html"><button>User Management</button></a>
                <a href="audit-log.html"><button class="active">Audit Log</button></a>
            </nav>

        </aside>

        <main class="main-content" id="main-content">

            <header class="top-card" id="top-card">
                <h1>Audit Log</h1>
            </header>

            <section class="card" id="audit-filter-card">

                <h2>Filter Logs</h2>

                <form id="auditFilterForm">

                    <input type="date" id="log-date">

                    <select id="log-user">
                        <option value="">All Users</option>
                        <option value="Admin">Admin</option>
                        <option value="Tax Officer">Tax Officer</option>
                        <option value="Taxpayer">Taxpayer</option>
                    </select>

                    <select id="log-action">
                        <option value="">All Actions</option>
                        <option value="Register">Register</option>
                        <option value="Login">Login</option>
                        <option value="Add Record">Add Record</option>
                        <option value="Update Record">Update Record</option>
                        <option value="Delete Record">Delete Record</option>
                        <option value="Update User">Update User</option>
                        <option value="Delete User">Delete User</option>
                    </select>

                    <button type="submit">
                        Filter
                    </button>

                </form>

            </section>

            <section class="card" id="audit-table-card">

                <h2>System Activity</h2>

                <table id="audit-table">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>User</th>
                            <th>Action</th>
                            <th>Description</th>
                            <th>Status</th>
                            <th>Date</th>
                        </tr>
                    </thead>

                    <tbody id="auditTable"></tbody>

                </table>

            </section>

        </main>

    </div>

    <script src="main.js"></script>
    <script src="message.js"></script>
    <script src="auth.js"></script>
    <script src="role-check.js"></script>
    <script src="logout.js"></script>
    <script src="audit-log.js"></script>

</body>
</html>
