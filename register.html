<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tax Management App">
    <meta name="keywords" content="Tax Management App">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>

<body>

    <div class="auth-container" id="auth-container">

        <div class="auth-card" id="auth-card">

            <h2 class="logo" id="logo">TaxApp</h2>
            <h1>Register</h1>

            <form id="registerForm">

                <input type="text" id="register-name" placeholder="Full Name" required>

                <input type="email" id="register-email" placeholder="Email Address" required>

                <input type="password" id="register-password" placeholder="Password" required>

                <select id="register-role">
                    <option value="Taxpayer">Taxpayer</option>
                    <option value="Tax Officer">Tax Officer</option>
                </select>

                <button type="submit">Register</button>

            </form>

            <p>
                Already have an account? 
                <a href="login.html">Login</a>
            </p>

        </div>

    </div>
    <div id="message-box" class="message-box"></div>

<script src="main.js"></script>
<script src="register.js"></script>
 <script src="logout.js"></script>
 <script src="message.js"></script>

</body>
</html>
