<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tax Management App">
    <meta name="keywords" content="Tax Management App">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>

<body>


    <div class="mobile-nav" id="mobile-nav">
    <div class="mobile-nav-top">
        <button onclick="menuOpen()" class="menu-btn" id="menu-btn">
            <span class="material-symbols-outlined">menu</span>
        </button>

         <a href="profile.html" id="user-profile" class="mobile-user-profile"><img id="profile-pic" class="profile-pic" src="Images/stock-profile.jpeg"></a>
        <button id="mobile-logout-btn" class="mobile-logout-btn">LogOut</button>
    </div>

    <div class="mobile-nav-links" id="mobile-nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="records.html">Records</a>
        <a href="tax-summary.html">Tax Summary</a>
        <a href="user-management.html">User Management</a>
        <a href="audit-log.html">Audit Log</a>
    </div>
</div>



    <div class="admin-nav" id="admin-nav"> 
        <h2 class="logo" id="logo">TaxApp</h2>
         <a href="profile.html" id="user-profile" class="user-profile"><img id="profile-pic" class="profile-pic" src="Images/stock-profile.jpeg"></a>
        <button id="logout-btn" class="logout-btn">LogOut</button>
    </div>

    <div class="app" id="app">

        <aside class="sidebar" id="sidebar">
            <nav>
                <a href="dashboard.html"><button>Dashboard</button></a>
                <a href="records.html"><button>Records</button></a>
                <a href="tax-summary.html"><button>Tax Summary</button></a>
                <a href="user-management.html"><button class="active">User Management</button></a>
                <a href="audit-log.html"><button>Audit Log</button></a>
            </nav>
        </aside>   
        
        <main class="main-content" id="main-content">

            <header class="top-card" id="top-card">
                <h1>User Management</h1>
            </header>

            <section class="card" id="add-user-card">
                <h2>Add User</h2>

                <form id="userForm">
                    <input type="text" id="full-name" placeholder="Full Name" required>
                    <input type="email" id="email" placeholder="Email Address" required>

                    <select id="role">
                        <option value="Taxpayer">Taxpayer</option>
                        <option value="Tax Officer">Tax Officer</option>
                        <option value="Admin">Admin</option>
                    </select>

                    <select id="status">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>

                    <button type="submit">Add User</button>
                </form>
            </section>

            <section class="card" id="users-table-card">
                <h2>All Users</h2>

                <table id="users-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="usersTable">
                        <tr>
                            <td>John Mensah</td>
                            <td>john@example.com</td>
                            <td>Taxpayer</td>
                            <td>Active</td>
                            <td><button>View</button></td>
                        </tr>

                        <tr>
                            <td>Sarah Adams</td>
                            <td>sarah@example.com</td>
                            <td>Tax Officer</td>
                            <td>Active</td>
                            <td><button>View</button></td>
                        </tr>
                    </tbody>
                </table>
            </section>

        </main>

    </div>


    <div id="message-box" class="message-box"></div>

     <script src="main.js"></script>
    <script src="auth.js"></script>
    <script src="logout.js"></script>
    <script src="role-check.js"></script>
    <script src="message.js"></script>

</body>
</html>
