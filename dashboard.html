<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width = device-width, initial-scale=1.0">
        <meta name="description" content="Taxt Management App">
        <meta name="Keywords" content="Tax Management App">
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    </head>

    <body>


        <div class="mobile-nav" id="mobile-nav">
    <div class="mobile-nav-top">
        <button onclick="menuOpen()" class="menu-btn" id="menu-btn">
            <span class="material-symbols-outlined">menu</span>
        </button>

        <a href="profile.html" id="user-profile" class="mobile-user-profile"><img id="profile-pic" class="profile-pic" src="Images/stock-profile.jpeg"></a>
        <button id="mobile-logout-btn" class="mobile-logout-btn">LogOut</button>
    </div>

    <div class="mobile-nav-links" id="mobile-nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="records.html">Records</a>
        <a href="tax-summary.html">Tax Summary</a>
        <a href="user-management.html">User Management</a>
        <a href="audit-log.html">Audit Log</a>
    </div>
</div>



        <div class="admin-nav" id="admin-nav"> 
            <h2 class="logo" id="logo">TaxApp</h2>
            <a href="profile.html" id="user-profile" class="user-profile"><img id="profile-pic" class="profile-pic" src="Images/stock-profile.jpeg"></a>
            <button id="logout-btn" class="logout-btn">LogOut</button>
        </div>

        <div class="app" id="app">
            <aside class="sidebar" id="sidebar">
                <nav>
                    <a href="dashboard.html"><button class="active">Dashboard</button></a>
                    <a href="records.html"><button>Records</button></a>
                    <a href="tax-summary.html"><button>Tax Summary</button></a>
                    <a href="user-management.html"><button>User Management</button></a>
                    <a href="audit-log.html"><button>Audit Log</button></a>
                </nav>
            </aside>   
            

            <main class="main-content" id="main-content">
                <header class="top-card" id="top-card">
                    <h1>Dashboard</h1>
                </header>

                <section class="summary-cards" id="summary-cards">
                    <div class="card" id="card">
                        <h3>Total Income</h3>          
                        <p class="incomeValue" id="incomeValue">£12,500</p>
                    </div>

                    <div class="card">
                        <h3>Total Expenses</h3>
                        <p id="expenseValue">£4,200</p>
                    </div>

                    <div class="card">
                        <h3>Tax Due</h3>
                        <p id="taxValue">£1,660</p>
                    </div>

                    <div class="card">
                        <h3>Net Profit</h3>
                        <p id="profitValue">£8,300</p>
                    </div>
                </section>



                <section class="quick-actions" id="quick-actions">
                    <h2>Quick Actions</h2>
                    <div class="action-buttons" id="action-buttons">
                        <a href="records.html"><button>Add Record</button></a>
                        <a href="tax-summary.html"><button>Generate Summary</button></a>
                        <a href="audit-log.html"><button>View Audit Log</button></a>
                    </div>
                </section>




                <section class="recent-records" id="recent-records">
                    <h2>Recent Records</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Description</th>
                                <th>Category</th>
                                <th>Amount</th>
                            </tr>
                        </thead>

                        <tbody class="recordsBody" id="recordsBody">
                            

                        </tbody>
                </section>

            </main>

        </div>

        <div id="message-box" class="message-box"></div>

 
        <script src="main.js"></script>
        <script src="dashboard.js"></script>
        <script src="auth.js"></script>
        <script src="logout.js"></script>


    </body>
</html>
